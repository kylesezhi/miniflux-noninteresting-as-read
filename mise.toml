# mise-en-place configuration for miniflux-noninteresting-as-read.
#
# Tool dependencies are pinned so `mise install` provisions everything:
# a Python 3.12 toolchain, uv (matching the tool that generated uv.lock),
# Node 20, and PM2 (replacing `npm install -g pm2`).
# Run tasks: see `mise tasks`, e.g. `mise run test`, `mise run pipeline`.

[tools]
python = "3.12"
uv = "0.5.9"
node = "20"
"npm:pm2" = "latest"

# ── Core tasks ────────────────────────────────────────────────────────

[tasks.install]
description = "Sync Python dependencies with uv"
run = "uv sync"

[tasks.test]
description = "Run the pytest suite"
run = "uv run pytest"

[tasks.pipeline]
description = "Run one classification pipeline run"
run = "uv run python -m miniflux_ai_filter"

[tasks.calibrate]
description = "Calibrate feed prompts against the real LLM"
run = "uv run python scripts/calibrate.py"

[tasks.web]
description = "Start the web log viewer (port 5000)"
run = "uv run python src/miniflux_ai_filter/web.py"

# ── PM2 wrappers ──────────────────────────────────────────────────────
# Use these (or `mise x npm:pm2 -- pm2 ...`) so PM2's daemon, and the
# tools it spawns, resolve mise-managed versions from mise's shims.

[tasks.pm2-start]
description = "Start both PM2 apps (hourly pipeline + web viewer)"
run = "pm2 start ecosystem.config.js"

[tasks.pm2-stop]
description = "Stop both PM2 apps"
run = "pm2 stop miniflux-ai-filter miniflux-ai-filter-web"

[tasks.pm2-restart]
description = "Restart both PM2 apps"
run = "pm2 restart miniflux-ai-filter miniflux-ai-filter-web"

[tasks.pm2-status]
description = "Show PM2 process list"
run = "pm2 list"

[tasks.pm2-logs]
description = "Stream PM2 logs (Ctrl+C to exit)"
run = "pm2 logs"

[tasks.pm2-save]
description = "Save the PM2 process list for resurrection at boot"
run = "pm2 save"
